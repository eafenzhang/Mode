[package]
name = "mode-tauri"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Mode 桌面端 Tauri v2 壳（路线图 M1）"

[[bin]]
name = "ModeTauri"
path = "src/main.rs"

[features]
# M3 Task 0 的端口传输 harness（测试资产，见 docs/plans/2026-10-16-m3-port-transport-spike.md）。
# 用 required-features 门住：默认构建 / `tauri build` / `clippy --all-targets` 都不带它，
# 只有显式 `--features port-transport-harness` 才编出这个 bin。
port-transport-harness = []

[[bin]]
name = "PortTransportHarness"
path = "src/bin/port_transport_harness.rs"
required-features = ["port-transport-harness"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
platform = { path = "../../../crates/platform" }
protocol = { path = "../../../crates/protocol" }
updater = { path = "../../../crates/updater" }
tray = { path = "../../../crates/tray" }
deeplink = { path = "../../../crates/deeplink" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
# main.rs 要注册插件本体（deeplink crate 只用它的 API），故这里直接依赖。
tauri-plugin-deep-link.workspace = true
