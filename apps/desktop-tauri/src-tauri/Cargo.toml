[package]
name = "mode-tauri"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Mode 桌面端 Tauri v2 壳（路线图 M1）"
# 本包有 lib + 四个 bin（产品壳、Task 0 harness、Task 1/3 的两个 opt-in harness），
# 不定默认 bin 的话 `cargo run -p mode-tauri` 会因歧义失败（M1 spec §4 的命令）。
default-run = "ModeTauri"

[[bin]]
name = "ModeTauri"
path = "src/main.rs"

[features]
# M3 Task 0 的端口传输 harness（测试资产，见 docs/plans/2026-10-16-m3-port-transport-spike.md）。
# 用 required-features 门住：默认构建 / `tauri build` / `clippy --all-targets` 都不带它，
# 只有显式 `--features port-transport-harness` 才编出这个 bin。
port-transport-harness = []

# M3 Task 1 的 opt-in 集成 harness（同上，测试资产）。
host-roundtrip = []

# M3 Task 3 的 opt-in **真产品 UI** harness（同上，测试资产）：加载 renderer 的构建产物
# （`index.html`）并追加一段探针注入，用来验「真实产品 UI 挂得上、业务面能用」。
product-ui-harness = []

[[bin]]
name = "PortTransportHarness"
path = "src/bin/port_transport_harness.rs"
required-features = ["port-transport-harness"]

# M3 Task 1 的 opt-in 真 webview 往返 harness（测试资产，见
# docs/specs/tauri-renderer-host.md）。同样用 required-features 门住：
# 默认构建 / `tauri build` / `clippy --all-targets` 都不带它。
[[bin]]
name = "HostRoundtripHarness"
path = "src/bin/host_roundtrip_harness.rs"
required-features = ["host-roundtrip"]

# M3 Task 3 的 opt-in 真产品 UI harness（同上）。
#
# **已知代价（复评 Minor 11，登记为 Task 5 的输入）**：`required-features` 门住的 bin
# **不在 `clippy --workspace --all-targets -- -D warnings` 的检查范围里**——`--all-targets`
# 只覆盖默认 feature 的 target，所以这三个 harness 源码事实上**没有 lint 覆盖**。
# 要覆盖它们得单独跑
# `clippy -p mode-tauri --features port-transport-harness,host-roundtrip,product-ui-harness --bins -- -D warnings`。
# 本任务没有把它接进 CI 门禁（改门禁超出本任务授权），登记在 spec 的 §20 开放项里。
# **复评 Minor 11 那轮真跑了这条命令**，抓到并修掉两处 `clippy::let_unit_value`
# （`HostRoundtripHarness`/`ProductUiHarness` 的 watchdog 线程里 `let _ = exit_handle.exit(0)`；
# 该命令返回 `()`，`let _ =` 是多余的）。剩下的风险是**结构性的**：将来再加 harness bin
# 仍可能悄悄漏掉 lint——那属于 CI 门禁，仍归 §20 第 4 条。
[[bin]]
name = "ProductUiHarness"
path = "src/bin/product_ui_harness.rs"
required-features = ["product-ui-harness"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
platform = { path = "../../../crates/platform" }
sidecar-host = { path = "../../../crates/sidecar-host" }
protocol = { path = "../../../crates/protocol" }
updater = { path = "../../../crates/updater" }
tray = { path = "../../../crates/tray" }
deeplink = { path = "../../../crates/deeplink" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
# main.rs 要注册插件本体（deeplink crate 只用它的 API），故这里直接依赖。
tauri-plugin-deep-link.workspace = true
