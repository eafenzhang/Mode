<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161616" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
    <title>Mode - 远程控制</title>
    <!-- 独立入口不写内联脚本：rc.mymode.cloud 的 CSP 是 script-src 'self'。
         主题在 entry.tsx 里由 applyWebThemeToDocument 统一落地；这里只给首屏底色，
         避免 JS 执行前露出白底。样式用内联 <style>，CSP 的 style-src 已允许。 -->
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--color-background, #161616);
        color: var(--color-foreground, #e2e8f0);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Microsoft YaHei UI",
          "Microsoft YaHei",
          "PingFang SC",
          "Noto Sans CJK SC",
          sans-serif;
      }
      html.theme-zai-light,
      html.theme-zai-light body,
      html.theme-zai-light #root {
        background: var(--color-background, #f8f8f8);
        color: var(--color-foreground, #334155);
      }
      .mode-boot-loading {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 首帧占位：远程控制页挂载后立即替换。 -->
      <div class="mode-boot-loading" role="status" aria-live="polite" aria-busy="true">
        正在加载…
      </div>
    </div>
    <script type="module" src="/src/v3/entry.tsx"></script>
  </body>
</html>
