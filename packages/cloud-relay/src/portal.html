<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Mode Cloud</title>
    <style>
      :root {
        --bg: #f8f8f8;
        --fg: #161616;
        --muted: #666;
        --card: #ffffff;
        --border: #e4e4e4;
        --accent: #0ea5e9;
        --danger: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161616;
          --fg: #e8e8e8;
          --muted: #9a9a9a;
          --card: #1f1f1f;
          --border: #333;
          --accent: #38bdf8;
          --danger: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 24px;
      }
      h1 { font-size: 22px; margin: 0; letter-spacing: 0.01em; }
      h1 small { color: var(--muted); font-size: 13px; font-weight: 400; margin-left: 8px; }
      button {
        font: inherit;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        border-radius: 8px;
        padding: 7px 14px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.55; cursor: default; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
      }
      .muted { color: var(--muted); font-size: 13px; }
      .code {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 26px;
        letter-spacing: 0.22em;
        padding: 10px 0;
      }
      .error { color: var(--danger); font-size: 13px; margin: 10px 0 0; }
      ul { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
      li.device {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        background: var(--card);
      }
      .device-name { font-weight: 500; }
      .device-meta { color: var(--muted); font-size: 13px; }
      .device.online .dot { color: #22c55e; }
      .device .dot { color: var(--muted); }
      .device a {
        color: var(--accent);
        text-decoration: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 12px;
        white-space: nowrap;
      }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Mode Cloud <small>个人账号与设备</small></h1>
        <div id="account" class="row" hidden>
          <span id="account-name" class="muted"></span>
          <button id="logout" type="button">退出</button>
        </div>
      </header>

      <section id="auth-view" class="card">
        <p class="muted">使用 GitHub 登录你的 Mode Cloud 账号；授权完成后自动返回。</p>
        <div class="row">
          <button id="github-login" type="button" class="primary">使用 GitHub 登录</button>
        </div>
        <div id="github-panel" hidden>
          <p class="muted">
            正在打开
            <a id="github-link" href="https://github.com/login/device" target="_blank" rel="noreferrer"
              >github.com/login/device</a
            >
            ，或手动输入下面的代码完成授权：
          </p>
          <div id="github-code" class="code"></div>
          <p id="github-status" class="muted">等待 GitHub 授权…</p>
        </div>
        <p id="error" class="error" hidden></p>
      </section>

      <section id="devices-view" hidden>
        <p class="muted">
          登录同一账号的设备会自动出现在这里；点击「打开远控」直达该设备的远程控制页，无需配对码。
        </p>
        <ul id="devices"></ul>
        <p id="empty" class="muted" hidden>
          账号下还没有设备：在桌面端或被控端登录同一账号即可自动上线。
        </p>
        <p id="devices-error" class="error" hidden></p>
      </section>
    </main>

    <script>
      (function () {
        "use strict";
        var $ = function (id) {
          return document.getElementById(id);
        };
        var githubTimer = null;
        var started = false;

        function showError(message) {
          $("error").textContent = message;
          $("error").hidden = !message;
        }

        function showDevicesError(message) {
          $("devices-error").textContent = message;
          $("devices-error").hidden = !message;
        }

        async function api(path, options) {
          var init = options || {};
          var response = await fetch(path, {
            method: init.method || "GET",
            headers: Object.assign(
              { "content-type": "application/json" },
              init.headers || {}
            ),
            body: init.body ? JSON.stringify(init.body) : undefined,
            credentials: "same-origin",
          });
          var body = null;
          try {
            body = await response.json();
          } catch (ignored) {
            body = null;
          }
          return { status: response.status, body: body };
        }

        function showAuth() {
          $("account").hidden = true;
          $("devices-view").hidden = true;
          $("auth-view").hidden = false;
          $("devices").textContent = "";
        }

        function renderDevices(payload) {
          var account = (payload && payload.account) || {};
          $("account-name").textContent = account.displayName || account.id || "";
          $("account").hidden = false;
          $("auth-view").hidden = true;
          $("devices-view").hidden = false;
          showDevicesError("");

          var devices = (payload && payload.devices) || [];
          var list = $("devices");
          list.textContent = "";
          $("empty").hidden = devices.length > 0;
          devices.forEach(function (device) {
            var item = document.createElement("li");
            item.className = "device" + (device.online ? " online" : "");

            var info = document.createElement("div");
            var title = document.createElement("div");
            title.className = "device-name";
            title.textContent = device.name;
            var meta = document.createElement("div");
            meta.className = "device-meta";
            meta.textContent =
              (device.platform || "") + " · " + (device.online ? "在线" : "离线") +
              (device.accessToken ? "" : " · 需重新登录");
            info.appendChild(title);
            info.appendChild(meta);

            // 目录直连：同账号即信任，令牌由目录下发（docs/specs/cloud-personal-accounts.md）。
            var link = document.createElement("a");
            if (device.accessToken) {
              link.href =
                device.relayUrl +
                (device.relayUrl.indexOf("?") >= 0 ? "&" : "?") +
                "token=" +
                encodeURIComponent(device.accessToken);
              link.textContent = "打开远控";
            } else {
              link.href = "javascript:void(0)";
              link.style.opacity = "0.5";
              link.style.pointerEvents = "none";
              link.textContent = "需重新登录";
            }
            if (!device.online) {
              link.setAttribute("aria-disabled", "true");
              link.style.opacity = "0.5";
              link.style.pointerEvents = "none";
            }

            item.appendChild(info);
            item.appendChild(link);
            list.appendChild(item);
          });
        }

        async function loadDevices() {
          var result = await api("/v1/devices");
          if (result.status === 200) {
            renderDevices(result.body);
            return true;
          }
          if (result.status === 401) {
            showAuth();
            return false;
          }
          showAuth();
          showError("加载设备失败（HTTP " + result.status + "）");
          return false;
        }

        function stopGithubPolling() {
          if (githubTimer) {
            clearInterval(githubTimer);
            githubTimer = null;
          }
        }

        function startGithubPolling(loginId) {
          stopGithubPolling();
          githubTimer = setInterval(async function () {
            var result = await api("/v1/auth/github/device/poll", {
              method: "POST",
              body: { loginId: loginId },
            });
            if (result.status === 202) {
              return;
            }
            stopGithubPolling();
            if (result.status === 200) {
              $("github-panel").hidden = true;
              await loadDevices();
              return;
            }
            started = false;
            $("github-status").textContent = "GitHub 登录失败，请重新发起。";
            if (result.body && result.body.error === "expired_token") {
              $("github-status").textContent = "授权码已过期，请重新发起。";
            }
          }, 5000);
        }

        async function beginGithubLogin() {
          if (started) {
            return;
          }
          started = true;
          showError("");
          $("github-panel").hidden = false;
          $("github-code").textContent = "…";
          $("github-status").textContent = "正在获取 GitHub 设备码…";
          var result = await api("/v1/auth/github/device/start", { method: "POST", body: {} });
          if (result.status !== 200 || !result.body || !result.body.loginId) {
            started = false;
            $("github-panel").hidden = true;
            showError(
              result.status === 503
                ? "服务端未配置 GitHub 登录（MODE_CLOUD_GITHUB_CLIENT_ID）。"
                : "无法连接 GitHub，请稍后重试。"
            );
            return;
          }
          $("github-code").textContent = result.body.userCode;
          $("github-link").href = result.body.verificationUri;
          $("github-status").textContent = "等待 GitHub 授权…";
          // 自动跳转授权页；用户授权回来自动进入设备列表（v2 交互）。
          setTimeout(function () {
            window.location.href = result.body.verificationUri;
          }, 800);
          startGithubPolling(result.body.loginId);
        }

        $("github-login").addEventListener("click", function () {
          void beginGithubLogin();
        });

        $("logout").addEventListener("click", async function () {
          stopGithubPolling();
          await api("/v1/auth/logout", { method: "POST", body: {} }).catch(function () {
            return null;
          });
          $("github-panel").hidden = true;
          showAuth();
        });

        loadDevices()
          .then(function (bound) {
            // 未登录：自动开始 GitHub 授权流程（v2：打开页面即出码并跳转）。
            if (!bound) {
              void beginGithubLogin();
            }
          })
          .catch(function () {
            showAuth();
            showError("无法连接服务端。");
          });
      })();
    </script>
  </body>
</html>
