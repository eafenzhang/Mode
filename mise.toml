[tools]
node = "24.14.0"
pnpm = "10.33.2"

[env]
COREPACK_ENABLE_PROJECT_SPEC = "0"

[tasks.install]
description = "Install root workspace dependencies with the pinned pnpm."
run = "mise exec -- node scripts/mise-run.mjs pnpm install"

[tasks.bootstrap]
description = "Run the repository bootstrap script after installing dependencies."
depends = ["install"]
run = "mise exec -- node scripts/mise-run.mjs pnpm bootstrap"

[tasks.dev]
description = "Start the Tauri desktop app in an isolated local test environment."
env = { MODE_DATA_BASE_DIR = "{{env.HOME}}/.mode-dev-home" }
run = "mise exec -- node scripts/mise-run.mjs pnpm dev:desktop"

[tasks.dev-desktop-prod]
description = "Start the Tauri desktop app against the production environment."
run = "mise exec -- node scripts/mise-run.mjs pnpm dev:desktop"

[tasks.dev-web]
description = "Start the server and web client dev servers."
run = "mise exec -- node scripts/mise-run.mjs pnpm dev:web"

[tasks.typecheck]
description = "Run the root TypeScript project references check."
run = "mise exec -- node scripts/mise-run.mjs pnpm typecheck"

[tasks.lint]
description = "Run the root linter."
run = "mise exec -- node scripts/mise-run.mjs pnpm lint"

# 本地 Rust 构建需要装配 gnu 工具链：本机默认 toolchain 的 host 是 msvc，而机器上没装
# VS Build Tools（Git Bash 自带的 coreutils `link` 又会挡住 `link.exe`）。装配口径在
# scripts/rust-gnu-env.ts，本 task 只是把它包成一条命令，参数原样透传给 cargo：
#   mise run rust -- test --workspace
#   mise run rust -- build --release -p mode-tauri
# CI 走 msvc / Linux，用不上这条（装配在那边退化成 no-op），直接调 cargo 即可。
[tasks.rust]
description = "Run a cargo subcommand with the local gnu toolchain assembled."
run = "mise exec -- node scripts/rust-cargo.ts"
