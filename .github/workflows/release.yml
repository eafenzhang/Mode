name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号：3.14.0（勾选预发布=自动生成 3.14.0-audit.<当天日期>，同日重复构建自动加 .2/.3；不勾选=正式版 v3.14.0）；也可直接填完整日期形式 3.14.0-audit.20260922[.2]"
        required: true
        type: string
      prerelease:
        description: "预发布（audit 日期式版本）；不勾选则发布正式版（干净版本号，成为 GitHub Latest）"
        required: false
        type: boolean
        default: false
      build_artifacts:
        description: "构建 CLI 发行包和桌面客户端并上传到 Release；全部上传成功后才发布（失败则保持 draft）"
        required: false
        type: boolean
        default: true
      keep_draft:
        description: "保持 draft 不公开（用于上游审计自动构建的测试版本；勾选后即使全部成功也不发布）"
        required: false
        type: boolean
        default: false
      notice:
        description: "插入 Release 说明顶部的警示文本（可选，支持多行；用于测试版提示）"
        required: false
        type: string
  # 推送 main 即自动发版：版本号取「最近一个正式版 tag 的 patch + 1」（已被占用就继续 +1），
  # 提交信息里带 [skip release] 时整条流水线跳过。需要指定版本（正式版 / 预发布）时仍用上面的手工触发。
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # 推送触发时，提交信息含 [skip release] 就跳过整条流水线（下游 job 依赖本 job，跟着一起跳过）。
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]') }}
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # 推送触发的自动发版：无需输入版本，取「最近一个正式版 tag 的 patch + 1」；
          # 该版本已被占用（同一次推送重跑、或并发）就继续 +1，保证 tag 不冲突、版本单调递增，
          # 应用内自动更新（Tauri updater 比版本号大小）才能一路升上去。
          if [ "$EVENT_NAME" = "push" ]; then
            # 只认正式版 tag（v<major>.<minor>.<patch>）：预发布/审计 tag 不参与基线，
            # 否则自动版本会被推进到预发布序列上。
            # `--merged HEAD`：只认从本次提交可达的 tag。仓库里存在来自另一条历史的
            # 孤儿 tag（如 v3.14.3，不是 main 的祖先），纯按大小排序会把它当基线，
            # 把自动版本推到 3.14.x 那条线上。
            LATEST="$(git tag --list --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
            if [ -n "$LATEST" ]; then PRE="${LATEST#v}"; else PRE="0.0.0"; fi
            IFS=. read -r MA MI PA <<< "$PRE"
            PA=$((PA + 1))
            while git ls-remote --tags origin "refs/tags/v$MA.$MI.$PA" | grep -q .; do
              PA=$((PA + 1))
            done
            TAG="v$MA.$MI.$PA"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$MA.$MI.$PA" >> "$GITHUB_OUTPUT"
            echo "推送触发的自动版本：$TAG（基线 ${LATEST:-无}）"
            exit 0
          fi
          # 版本命名：
          #   3.14.0 + 勾选预发布 -> 3.14.0-audit.<YYYYMMDD>（同一天重复构建自动追加 .2/.3/...）
          #   3.14.0 + 不勾选     -> v3.14.0（正式版，成为 GitHub Latest，/releases/latest 可用）
          #   完整日期形式         -> 严格按给定版本使用，不自动递增
          DATE="$(date -u +%Y%m%d)"
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' && [ "$PRERELEASE" != "true" ]; then
            TAG="v$VERSION"
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              echo "::error::Tag $TAG already exists"
              exit 1
            fi
          elif printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            BASE="$VERSION-audit.$DATE"
            TAG="v$BASE"
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              SEQ=2
              while git ls-remote --tags origin "refs/tags/v$BASE.$SEQ" | grep -q .; do
                SEQ=$((SEQ + 1))
              done
              TAG="v$BASE.$SEQ"
            fi
          elif printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-audit\.[0-9]{8}(\.[0-9]+)?$'; then
            TAG="v$VERSION"
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              echo "::error::Tag $TAG already exists; pass the base version (e.g. 3.14.0) to auto-sequence, or pick another date/suffix"
              exit 1
            fi
          else
            echo "::error::Invalid version \"$VERSION\". Use 3.14.0 (pre-release: date and same-day sequence are appended; stable: v3.14.0) or the full form 3.14.0-audit.20260922[.2]"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 桌面构建用完整版本（不带 v 前缀）注入 MODE_APP_VERSION，让安装包文件名带审计序号。
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # tag 在构建前就推送，但 release 先建为 draft：
      # 官网/下载页只解析已发布且带产物列表的 release，draft 不会露出，
      # 避免用户在构建过程中下到某个尚未上传完成的平台产物（404）。
      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          NOTICE: ${{ inputs.notice }}
        run: |
          set -euo pipefail
          # 产品名从产品身份模块取（正式身份要 MODE_ENV=production，否则解析成 Preview）。
          # 不写死在这里：改名时标题与说明跟着变，别再让旧名字卡住发版。
          PRODUCT_NAME=$(MODE_ENV=production node -e "import('./packages/desktop/scripts/desktop-product-identity.mjs').then((m) => process.stdout.write(m.resolveDesktopProductIdentity(process.env).productName))")
          echo "产品名：$PRODUCT_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          cat > /tmp/release-notes.md <<'NOTES'
          # <PRODUCT> <VERSION>

          <PRODUCT> 是基于公开发布的 Mode 持续维护的独立分支（延续 Mode 审计分支）：桌面端、浏览器工作区与终端 TUI 共享同一个 Agent 运行时，移除监控与遥测、不再连接官方平台服务，并补上 IM 机器人、局域网远程连接与随包离线插件目录。

          <PRODUCT> is an independently maintained fork of the open-source Mode (continuing the Mode audit fork): desktop, browser workspace and terminal TUI still share one agent runtime, with monitoring and telemetry removed, official platform services retired, plus IM bots, LAN remote connections and an offline bundled plugin catalog.

          ## 安装与升级 / Install and update

          - **Windows（.exe）**：`<PRODUCT>-<VERSION>-win-x64.exe`。安装包没有代码签名，SmartScreen 会提示「Windows 已保护你的电脑」——点「更多信息」→「仍要运行」即可。
            - **从旧 Electron 版迁移（旧线已 EOL）**：旧 Electron 线不再发布，Release 里只有 `latest.json`、没有 `latest.yml`；旧客户端的应用内更新会拿到 404，**需要手动下载并安装一次**（`<PRODUCT>-<VERSION>-win-x64.exe`）。装好这一版后，后续 Tauri 版本可在应用内「帮助 → 检查更新」升级。
            - **本版之后的 Tauri 版本**：应用内「帮助 → 检查更新」直接走本仓库 Releases 升级。
            - **安装身份**：本版主程序是 `Mode.exe`；旧 Electron 线已 EOL，不再发布。若机器上仍有旧版，两者独立安装、并存（安装目录、快捷方式、卸载项和数据目录都不同），本版不会就地替换旧版。
          - **macOS（.dmg，Apple Silicon）**：`<PRODUCT>-<VERSION>-mac-arm64.dmg`。仅支持 arm64（Apple Silicon），Intel Mac 不适用；产物**未签名、未公证**，首次打开若被 Gatekeeper 拦截，请右键应用选「打开」，或执行 `xattr -dr com.apple.quarantine /Applications/<PRODUCT>.app`。macOS 产物尚未做真机运行验收。
          - **Linux（.AppImage，x64）**：`<PRODUCT>-<VERSION>-linux-x64.AppImage`。`chmod +x` 后直接运行；若系统缺少 FUSE，可加 `--appimage-extract-and-run`。Linux 产物尚未做真机运行验收。
          - **fnOS（.fpk）**：`mode-<VERSION>-x86_64.fpk`，飞牛应用中心「手动安装」选择该文件；安装后从飞牛桌面入口打开（走飞牛统一网关，登录态直达，异地也可用）。
          - **校验与更新元数据**：`sha256.txt` 覆盖上方全部安装包。应用内自动更新目前只有 Windows 接入（`latest.json` 仅含 `windows-x86_64` 与安装包 `.sig`）；macOS/Linux 请手动下载新版替换。

          - **Windows (.exe)**: `<PRODUCT>-<VERSION>-win-x64.exe`. Unsigned build, so SmartScreen shows "Windows protected your PC" - click **More info** -> **Run anyway**.
            - **Migrating from the old Electron build (legacy line EOL)**: the old Electron line is no longer released. Releases ship `latest.json` but no `latest.yml`, so the old client's in-app updater gets a 404; **download and install once manually** (`<PRODUCT>-<VERSION>-win-x64.exe`). After that one-time install, later Tauri releases update in place via **Help -> Check for updates**.
            - **From this Tauri release onward**: in-app updates via **Help -> Check for updates** use this repository's Releases.
            - **Install identity**: the main executable is `Mode.exe`; the old Electron line is EOL and no longer released. If an old install remains, the two install separately and side by side (different install directory, shortcuts, uninstall entry, and user-data directory); this release does not replace the old app in place.
          - **macOS (.dmg, Apple Silicon)**: `<PRODUCT>-<VERSION>-mac-arm64.dmg`. arm64 only (Apple Silicon); not for Intel Macs. The build is **unsigned and not notarized**; if Gatekeeper blocks the first launch, right-click the app and choose **Open**, or run `xattr -dr com.apple.quarantine /Applications/<PRODUCT>.app`. macOS artifacts have not yet been runtime-tested on real hardware.
          - **Linux (.AppImage, x64)**: `<PRODUCT>-<VERSION>-linux-x64.AppImage`. `chmod +x` then run; if FUSE is unavailable, add `--appimage-extract-and-run`. Linux artifacts have not yet been runtime-tested on real hardware.
          - **fnOS (.fpk)**: `mode-<VERSION>-x86_64.fpk`; install it from the fnOS App Center via "Manual install", then open it from the fnOS desktop entry (routed through the fnOS gateway with your desktop login, works remotely too).
          - **Checksums and update metadata**: `sha256.txt` covers all installers above. In-app updates are currently wired for Windows only (`latest.json` contains just `windows-x86_64` plus the installer `.sig`); macOS/Linux users should download and replace the app manually.

          ## 反馈 / Feedback

          - 问题与建议请开 Issue：https://github.com/eafenzhang/Mode/issues
          - Issues and suggestions: https://github.com/eafenzhang/Mode/issues
          NOTES
          sed -i "s/<VERSION>/${TAG#v}/g; s/<PRODUCT>/${PRODUCT_NAME}/g" /tmp/release-notes.md
          # 自动生成版本差异 Changelog：对比最近的正式 tag（排除 ci 类提交），插入到标题之后。
          # 审计/预发布 tag（v3.14.4-audit.20260929.2 这类）会被 draft 构建打在 main 上；
          # 若让它们参与 describe，正式版的基线会切到 draft tag，Changelog 只剩一行。
          # 只接受正式版 tag（v<semver>，无连字符）。
          # 条目按 .github/changelog-zh.json 渲染为中英双语；缺翻译时附隐藏 TODO 注释。
          BASE_TAG=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' "${TAG}^" 2>/dev/null || true)
          if [ -n "$BASE_TAG" ]; then
            CHANGES=$(node scripts/render-release-changelog.mjs --from "$BASE_TAG" --to "$TAG")
            {
              echo "## Changelog (vs $BASE_TAG) / 更新日志（相对 $BASE_TAG）"
              echo ""
              if [ -n "$CHANGES" ]; then
                printf '%s\n' "$CHANGES"
              else
                echo "- 无代码变更 / No code changes"
              fi
              echo ""
              echo "对比完整变更 / Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/${BASE_TAG}...${TAG}"
              echo ""
              echo "---"
              echo ""
            } > /tmp/changelog-section.md
            head -n 1 /tmp/release-notes.md > /tmp/release-notes-title.md
            tail -n +2 /tmp/release-notes.md > /tmp/release-notes-rest.md
            { cat /tmp/release-notes-title.md; echo; cat /tmp/changelog-section.md; cat /tmp/release-notes-rest.md; } > /tmp/release-notes-merged.md
            mv /tmp/release-notes-merged.md /tmp/release-notes.md
          fi
          # 测试版警示（如上游审计自动构建的 draft）插入到说明顶部
          if [ -n "${NOTICE:-}" ]; then
            { printf '%s\n\n' "$NOTICE"; cat /tmp/release-notes.md; } > /tmp/release-notes-with-notice.md
            mv /tmp/release-notes-with-notice.md /tmp/release-notes.md
          fi
          # 标题跟随 0.0.1 的格式：`<产品名> <版本>`（不带 v 前缀）。
          args=(--draft --title "$PRODUCT_NAME ${TAG#v}" --notes-file /tmp/release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

  # 发版前的验收闸门：类型检查、Lint 与关键回归测试全绿才继续构建并发布。
  # 推送触发的自动发版没有人工复核环节，这道闸门用来挡住「一次坏提交把不可用的安装包推进更新通道」。
  verify:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: CLI check (registry + typecheck)
        # 根 `pnpm typecheck` 不包含 apps/mode-cli；CLI 发布包的类型错误和命令注册表过期
        # 都不能等到发布后才发现。registry 哈希已按平台归一，Windows/Linux 结果一致。
        run: pnpm check:cli
      - name: SQLite schema additive gate
        # 当前迁移必须与已提交基线一致；目标分支反篡改比较在 sqlite-schema.yml。
        run: pnpm check:sqlite-schema
      - name: Lint
        run: pnpm lint
      # 路线图 M5「三指标仪表入库」第 1 项：语言占比。
      # 这条从 M3 起就在 verify 里跑；M5 Task 3 只把它显式标成指标门禁。
      - name: Language policy metric (roadmap M5)
        run: node scripts/check-language-policy.mjs

      # 路线图 M2 Task 7：对拍矩阵的分类门禁（不是行覆盖率统计）。
      # 新增 packages/services 测试必须显式归类，运行时对拍资产必须存在；
      # 规则与清单见 docs/specs/agent-runtime-parity-matrix.md。
      - name: Agent runtime parity matrix (roadmap M2)
        run: pnpm exec tsx scripts/agent-runtime-parity-matrix.ts --check

      # 路线图 M5「三指标仪表入库」第 2 项：上游重合度（目标 0）。
      # 工具已交付：`scripts/upstream-overlap-check.ts`（口径见
      # docs/specs/upstream-overlap-metric.md）。**当前只跑 report（非阻断）**：
      # M4 的 UI/前端重写尚未开始，headline 明确 > 0；把未达标的阈值接成阻断会
      # 让每次发版必红，等于锁死发布线。M4 清零后把命令改成 `pnpm verify:self-developed`
      # （= `--strict`），本步骤即变成硬门禁。
      # 基线分支 `upstream/zcode-baseline` 是本地分支，CI 克隆里通常不存在；
      # report 模式在基线缺失时打印 `baseline unavailable` 并退出 0。
      - name: Upstream overlap metric (roadmap M5; report-only until M4 reaches zero)
        run: pnpm check:upstream-overlap
      - name: Shared, service, core and desktop tests
        run: |
          set -euo pipefail
          # dist-typed workspace 依赖必须先按 topo 链式构建，测试再跑（CI 全新检出没有历史 dist）：
          # - bootstrap 链（`...` = bootstrap 及其 workspace 依赖，含 @mode/adapters）：
          #   services 的 cua-overview-attribution 测试 import bootstrap/src，其
          #   @mode/adapters 解析到 dist —— 2026-10-11 verify 失败根因。
          # - core 链（contracts/dynamic-workflow/shared-types）：core 黄金测试（cua display）
          #   import dist —— 2026-10-10 verify 失败根因（单包 build 导致 Cannot find module
          #   '@mode/contracts'）。
          pnpm --filter "@mode/bootstrap..." build
          pnpm --filter "@mode/core..." build
          pnpm --filter @mode/shared test
          # WSS 中继 + /v1 控制面（SQLite）；测试自带临时库与本地端口，无 workspace dist 依赖。
          pnpm --filter @mode/cloud-relay test
          pnpm --filter @mode/services test
          pnpm --filter @mode/server test
          pnpm --filter @mode/ui test
          # TUI 纯逻辑契约（宽度/键盘/侧栏/compact/事件数据等）；依赖 @mode/contracts 与
          # @mode/i18n 的 dist，上面的 bootstrap 链已构建。
          pnpm --filter @mode/tui test
          pnpm --filter @mode/cua test
          pnpm --filter @mode/core test
          pnpm exec tsx --test packages/desktop/tests/*.test.mjs packages/desktop/tests/*.test.mts
          # M3 Task 1：Host sidecar 的端口往返（真 Host + 真 MessagePort + 真 rpc）+ Task 0 的端口回归。
          # 用例自己起 node 子进程；opt-in 的真 webview 那条默认 skip（CI 没有真窗口，覆盖分工见
          # docs/specs/tauri-renderer-host.md 的「覆盖分工」）。
          pnpm --filter @mode/desktop-tauri test

  # SSH/Docker 远程工作区的 linux-x64 运行时资产。发布到同一个 Release 的扁平布局，
  # 桌面 Host 构建期注入 `.../releases/download/v<version>`；服务端仍可用环境变量覆盖。
  # 只构建 linux-x64（fpk/NAS 与常见 SSH 主机）；其它平台按需把 prepare 的
  # `--platforms` 与这里的 `--platforms` 一起加回来。
  remote-assets:
    needs: [release, verify]
    if: ${{ always() && needs.release.result == 'success' && needs.verify.result == 'success' && inputs.build_artifacts != false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Remote asset publisher contract tests
        run: pnpm exec tsx --test scripts/test/publish-remote-assets.test.ts
      - name: Prepare linux-x64 remote assets
        env:
          # manifest 的 appVersion 必须与客户端 MODE_VERSION 完全一致；发布版用 tag 版本。
          MODE_APP_VERSION: ${{ needs.release.outputs.version }}
        run: pnpm --filter @mode/desktop prepare:remote-assets
      - name: Convert to GitHub Release flat layout
        run: |
          set -euo pipefail
          node scripts/publish-remote-assets.mjs \
            --version "${{ needs.release.outputs.version }}" \
            --platforms linux-x64
      - name: Upload remote assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/remote-assets-github/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::remote asset layout is empty"
            exit 1
          fi
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "::warning::remote asset upload failed (attempt $attempt/3), retrying in 10s"
            sleep 10
          done
          echo "::error::remote asset upload failed after 3 attempts"
          exit 1

  # M1 Tauri 骨架的三平台出包与体积基线（路线图 M1 Task 5）。
  #
  # **2026-10-19 起三平台安装包一起进 Release**（人决定，撤销 DR-M5-2 的 Windows-only 偏差）：
  # - Windows 腿上传安装包、`.sig` 与 `latest.json`（应用内更新清单仍只有 Windows）。
  # - macOS/Linux 腿上传 `.dmg` / `.AppImage` 与各自的校验片段；两条腿都成为发布门禁，
  #   任一失败 → `tauri.result = failure` → `checksums` / `publish` 不跑，Release 保持 draft。
  # - 旧 Electron 线已 EOL（docs/specs/legacy-electron-eol.md），不再有第二个 job 上传同名安装包。
  #
  # 三平台腿**未在本机验证过**（本机只有 Windows + gnu 工具链）：macOS 与 Linux 腿按
  # Tauri v2 官方要求列依赖，首次 CI 运行必须盯一下这几处：
  #   - Linux：webkit2gtk/soup3 的 dev 包名随发行版变动（见下面 apt 列表）；
  #     AppImage 打包依赖 FUSE，容器里靠 APPIMAGE_EXTRACT_AND_RUN=1 绕过，
  #     若仍失败可改用 `--bundles deb`（deb 只需 dpkg-deb，风险最低）。
  #   - macOS：arm64 runner（macos-14）出 aarch64-apple-darwin 产物。
  tauri:
    needs: [release, verify]
    if: ${{ github.event_name == 'push' || inputs.build_artifacts }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win
            arch: x64
            rustTarget: x86_64-pc-windows-msvc
            bundles: nsis
            ext: exe
          - runner: macos-14
            target: mac
            arch: arm64
            rustTarget: aarch64-apple-darwin
            bundles: dmg
            ext: dmg
          - runner: ubuntu-24.04
            target: linux
            arch: x64
            rustTarget: x86_64-unknown-linux-gnu
            bundles: appimage
            ext: AppImage
    # 三平台腿全部阻断发布（2026-10-19，DR-M5-2 更新）：v0.0.59 的 CI 已实际产出
    # macOS arm64 dmg 与 Linux x64 AppImage，构建风险已收口；运行时仍只在本机 Windows
    # 验证过，因此 Release 说明保留「mac/Linux 首次提供、未签名/未公证」的提示。
    # 任一腿失败 → tauri.result = failure → checksums/publish 不跑，release 保持 draft，
    # 不会发布缺平台的版本。
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Tauri v2 在 Linux 上要 GTK/WebKitGTK 的开发包；Windows/macOS 用系统自带 WebView。
      - name: Install Linux system dependencies
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libxdo-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}
          # §20 第 4 条：required-features 门住的 harness bin 要单独跑 clippy。
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # 与 desktop job 同一口径：根 workspace + 刻意排除的 CUA addon。
          workspaces: |
            crates/mode-cua-ax
            .
          key: tauri-${{ matrix.rustTarget }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Windows 产品包装 CUA helper（远程桌面媒体面与 CUA 都依赖它）。Tauri 的 Host 是
      # 纯 Node sidecar，打包态解析基准是 `resources/tools/cua-helper`；不随包会让
      # `rd_media_start` 永远报 helper_unavailable（主控显示「对端不支持远程桌面」）。
      # 与 `verify` job 同样的 msvc 目标；`build:package-inputs` 会把它 stage 进 ship 集。
      - name: Build and stage CUA helper
        if: matrix.target == 'win'
        env:
          MODE_CUA_AX_TARGET: x86_64-pc-windows-msvc
        run: pnpm build:cua-helper

      # Ruling 20：`@mode/desktop-tauri` 的套件里有 Windows-only 用例（sidecar 内真起
      # pty、win32-x64 发运集）。它们在 Ubuntu 的 `verify` job 上显式 skip；为了不让这些
      # skip 变成「哪里都不跑」的假绿，整条套件必须在**阻断发布**的 Windows 腿再跑一遍
      # （`publish` 的 needs 含 `tauri`；2026-10-19 起三平台腿都是阻断门禁）。
      - name: Tauri Node test suite (blocking release gate)
        if: matrix.target == 'win'
        shell: bash
        run: pnpm --filter @mode/desktop-tauri test

      # M0 browser-import helper：旧 Electron 诊断 job 删除后，把 Rust crate 测试与
      # C# oracle 黑盒对拍搬到这里。它覆盖的是 M0 的辅助验证，不阻断发布。
      - name: browser-import helper tests and oracle parity (diagnostic)
        if: matrix.target == 'win'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/browser-import-helper/Cargo.toml
          cargo clippy --manifest-path crates/browser-import-helper/Cargo.toml --all-targets -- -D warnings
          node packages/desktop/scripts/build-windows-browser-import-helper.mjs
          cp packages/desktop/bundled-tools/win32-x64/browser-import/mode-browser-import-helper.exe             "$RUNNER_TEMP/browser-import-oracle.exe"
          MODE_BROWSER_IMPORT_TARGET=x86_64-pc-windows-msvc pnpm --filter @mode/desktop prepare:browser-import-helper
          MODE_BROWSER_IMPORT_ORACLE_PATH="$RUNNER_TEMP/browser-import-oracle.exe"             node --test packages/desktop/tests/browser-import-helper-contract.test.mjs

      # M5 评审 B2：Rust 验证套件必须在**阻断发布**的腿上跑。
      # 之前这些命令只在 `desktop`（continue-on-error、且不在 publish.needs）里，
      # 于是失败的 deeplink/sidecar-host 测试或协议漂移也能发出全绿 Release。
      # 现在放进 Windows 发布腿：任一步失败 → tauri.result = failure → publish 不跑
      # （publish.if 要求 needs.tauri.result == 'success'）。这些检查仍是 Windows-only
      # （crate 依赖 Win32 API）；三平台腿都已阻断发布，但 mac/linux 只跑构建与上传。
      #
      # 两处编译前置，都由 build:package-inputs 一次备齐（它就是发布路径
      # beforeBuildCommand 的同一条产品装配命令，不要换成 build:frontend——那是
      # 开发/诊断档，产出 dist/dev/）：
      #  1. tauri::generate_context!() 在编译期读 tauri.conf.json 的 frontendDist
      #     （../dist），目录不存在就 proc macro panic；
      #  2. tauri-build 在**每次** cargo 构建时把 bundle.resources 拷进 target，
      #     所以 `../dist-host-sidecar/ship/{host-sidecar,node,config}` 也必须先存在。
      #     只建前端时 ship 集缺失，build script 直接失败：
      #     `resource path ..\dist-host-sidecar\ship\config doesn't exist`。
      # 这样门禁面对的输入与真正 `tauri build` 时完全一致。
      - name: Rust verification (blocking release gate)
        if: matrix.target == 'win'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @mode/desktop-tauri run build:package-inputs
          # updater 的 conf↔常量守卫（端点 / pubkey 非空且可解析）也在这条命令里
          # （M5 评审 B4a）。sidecar-host 会真拉 Node 子进程，需要 PATH 上有 node。
          # `--locked`：锁文件漂移直接失败，不允许 CI 静默重写（M5 评审 B3）。
          # agent-* / plugin-host* 是 M2/M3 的运行时与插件宿主：虽然暂未随 Tauri 安装包
          # 发布，但它们的对拍/生命周期套件必须持续跑，否则会在本地绿、发布时才发现腐烂。
          # 这些测试会 spawn node 与 bash（GitHub Windows runner 的 PATH 上都有）。
          # mode-tauri 的 web_assets_extraction（内嵌前端解压回归）此前不在本列表：
          # 它只会在本地跑，而本地 gnu 工具链下 build.rs 的 /MANIFEST 链接参数直接链接
          # 失败——MSVC runner 是它唯一的权威验证路径，漏掉等于从未跑过。
          cargo test --locked \
            -p platform -p protocol -p updater -p deeplink -p sidecar-host -p browser-import-host \
            -p agent-protocol -p agent-tools -p agent-core \
            -p plugin-host -p plugin-host-adapter \
            -p mode-tauri
          # `--all-targets` 覆盖 workspace 全部 crate 的 lib/bin/test/bench；
          # 被 required-features 门住的三个 harness bin 由下面的单独步骤覆盖。
          cargo clippy --locked --workspace --all-targets -- -D warnings
          # 协议双端：生成物必须与 crates/protocol 一致（漂移即红）。
          node scripts/generate-tauri-protocol.mjs --check

      # `tauri build` 会先跑 tauri.conf.json 的 beforeBuildCommand（前端 Vite 构建），
      # 所以这里不用单独构建前端。
      - name: Build Tauri bundles
        shell: bash
        env:
          # AppImage 的打包器（linuxdeploy）默认要求能挂载 FUSE，容器里没有；
          # 这个变量让 AppImage 以自解压方式运行，绕开 FUSE。
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # 自建 remote assets 源：桌面 Host 的 SSH/Docker 部署优先从这里取运行时；
          # 运行时环境变量仍可覆盖。URL 必须指向版本目录（GitHub 的 v<version> 形式）。
          MODE_REMOTE_ASSET_CDN_BASE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ needs.release.outputs.version }}
          # Updater 签名（M5 Task 1/2）。`createUpdaterArtifacts: true` + 非空 pubkey
          # 时，缺私钥会让 `tauri build` 以非 0 退出（fail closed，实测报错
          # "A public key has been found, but no private key..."），不会静默发布
          # 未签名包。secret 不存在时这里展开为空串，同样走 fail closed；所以
          # 发布前必须先按 RELEASE.md 3.1.1 建好两个 secret。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm --filter @mode/desktop-tauri exec tauri build \
            --target "${{ matrix.rustTarget }}" \
            --bundles "${{ matrix.bundles }}" \
            --config "{\"version\":\"${{ needs.release.outputs.version }}\"}"

      # §20 第 4 条收口（M5 Task 3）：`cargo clippy --all-targets` 覆盖不到被
      # `required-features` 门住的三个 harness bin（PortTransportHarness /
      # HostRoundtripHarness / ProductUiHarness），所以它们可能悄悄漏 lint。
      # 这一档原来只在发布前人工跑（RELEASE.md 2.2 V10）；接进 Windows 腿后，
      # 新加的 harness bin 每次发布都会被 lint。放在 `Build Tauri bundles` 之后，
      # 因为编译 mode-tauri 需要 tauri.conf.json 的 frontendDist（../dist）已存在。
      - name: Opt-in harness clippy (required-features bins)
        if: matrix.target == 'win'
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p mode-tauri \
            --features port-transport-harness,host-roundtrip,product-ui-harness \
            --bins -- -D warnings

      # 改名到发布契约的格式，并落一份 sha256 与体积记录——体积是三指标之一
      # （路线图「度量与预算」），在 CI 里留痕而不是靠人记。
      - name: Collect installer and record size
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
          RUST_TARGET: ${{ matrix.rustTarget }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_dir="target/${RUST_TARGET}/release/bundle"
          candidates=("$bundle_dir"/*/*."$EXT")
          if [ ${#candidates[@]} -ne 1 ]; then
            echo "::error::expected exactly one *.$EXT under $bundle_dir, found ${#candidates[@]}"
            find "$bundle_dir" -maxdepth 3 -type f || true
            exit 1
          fi
          mkdir -p dist/tauri
          out="dist/tauri/Mode-${VERSION}-${TARGET}-${ARCH}.${EXT}"
          cp "${candidates[0]}" "$out"
          node scripts/tauri-bundle-report.ts "$out"
          # Windows 是当前唯一进 Release 的腿：安装包、签名与 updater 清单必须同批产出。
          if [ "$TARGET" = "win" ]; then
            sig_src="${candidates[0]}.sig"
            if [ ! -f "$sig_src" ]; then
              echo "::error::missing $sig_src; TAURI_SIGNING_PRIVATE_KEY / _PASSWORD must be configured (fail closed)"
              exit 1
            fi
            cp "$sig_src" "${out}.sig"
            # 与安装包同批的前端入口快照（供 verify-installed.ts 比对；只留在
            # workflow artifact 里，不上传 Release）。
            cp "apps/desktop-tauri/dist/index.html" "${out}.index.html"
            node scripts/tauri-update-manifest.ts \
              --version "$VERSION" \
              --artifact "$out" \
              --signature "${out}.sig" \
              --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Mode-${VERSION}-win-x64.exe" \
              --notes "Release notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
              --output "dist/tauri/latest.json"
          fi

      # M5 评审 B4(b)：用**已提交的** `tauri.conf.json` 公钥做真正的密码学校验。
      # 只检查 `.sig` 文件存在不够：CI 私钥与入库 pubkey 不是一对时，文件在、签名
      # 却是别人签的，应用装上后永远无法更新。`crates/updater-verify` 与客户端使用
      # 同一个 `minisign-verify`；conf/pubkey/签名/安装包任一缺失、为空、为空串、
      # 格式错误或验签失败都以非 0 退出（fail closed）→ 本腿失败 → publish 不跑。
      - name: Verify updater signature against committed pubkey
        if: matrix.target == 'win'
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p updater-verify -- \
            apps/desktop-tauri/src-tauri/tauri.conf.json \
            "dist/tauri/Mode-${VERSION}-win-x64.exe" \
            "dist/tauri/Mode-${VERSION}-win-x64.exe.sig"

      # 路线图 M5「三指标仪表入库」第 3 项：CI 记录安装包体积。
      # 口径：**安装包字节**（`statSync().size`，MiB = 字节 / 1024²）；三平台各记一行。
      # `tauri-bundle-report.ts` 已把数字写进 `dist/tauri/size.txt` 与 job summary；
      # 这里再做一个显式的必跑步骤，防止以后有人删掉报告调用却让体积指标悄悄消失。
      #
      # **只记录，不设阈值**（DR-M5-2b：体积不作为发布阻断）。路线图 M5 的
      # 「初装 ≤30MB 核心 + sidecar 按需」按核心面实测是 23.29 MiB（§13.4，已达标）；
      # 但 Windows 这里量的是产品档总包（core + 随包 Node/externals），不是核心。
      # 不要把这个数当核心预算，也不要在这里加一个自编的阈值。
      - name: Record installer size metric (roadmap M5; recorded only)
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/tauri/size.txt || {
            echo "::error::installer size metric was not recorded (dist/tauri/size.txt missing or empty)"
            exit 1
          }
          echo "Installation size metric — face: bundle artifact bytes (MiB = bytes / 1024^2)"
          cat dist/tauri/size.txt
          echo "Note: the Windows line is the product package (core + bundled Node/externals); the roadmap M5 core budget (23.29 MiB <= 30 MB) is measured by measure-installer-budgets.ts, not by this line. No threshold is enforced (DR-M5-2b)."

      # 路线图 M4a：「发布门禁补『发运集核心载荷 ≤ 25 MB』的观测项」。
      # 口径：ship 集里 host-sidecar + agent + tools + config 的**未压缩目录字节和**
      # （node/ 是预算 (b)，刻意不进核心数）；与上面的安装包字节是两个测量面，不可混用。
      # **只记录，不阻断**（DR-M5-2b：体积不作为发布阻断）：脚本超 25 MB 只标 over-target。
      # ship 集由三平台腿 tauri build 的 beforeBuildCommand（build:package-inputs）stage，
      # 所以三条腿都能跑；缺 ship 目录时脚本自己会响亮失败（0 MB 假绿是更坏的结局）。
      - name: Record ship core payload metric (roadmap M4a; recorded only)
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx apps/desktop-tauri/scripts/measure-ship-core-payload.ts

      # 三平台安装包统一上传到同一个 Release。只上传明确文件，不用通配符——
      # 旧 Electron 线已 EOL，发布路径只有 Tauri 一条，所以 `--clobber` 只可能覆盖
      # 本腿自己重试的文件，不会碰到旧 tag。
      # Windows 额外带 `.sig` 与 `latest.json`（应用内更新清单目前只有 Windows）。
      - name: Upload Tauri installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          out="dist/tauri/Mode-${VERSION}-${TARGET}-${ARCH}.${EXT}"
          assets=("$out")
          if [ "$TARGET" = "win" ]; then
            assets+=("${out}.sig" "dist/tauri/latest.json")
          fi
          for file in "${assets[@]}"; do
            test -f "$file" || { echo "::error::missing $file"; exit 1; }
          done
          # GitHub API 偶发连接失败（runner 网络抖动），上传重试 3 次；--clobber 让重试可安全覆盖。
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "${assets[@]}" --clobber; then
              exit 0
            fi
            echo "::warning::gh release upload failed (attempt $attempt/3), retrying in 10s"
            sleep 10
          done
          echo "::error::gh release upload failed after 3 attempts"
          exit 1

      # 校验片段必须在**Release 上传成功之后**生成并上传：checksums job 用这些片段
      # 证明各平台安装包确实进了本次 Release。若上面的上传失败，本步及其后的 artifact
      # 上传都会跳过，checksums 缺少对应扩展名条目而失败，publish 因此不会公开一个
      # 缺安装包的 release。
      - name: Generate Tauri checksum fragment
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-checksums
          src="dist/tauri/Mode-${VERSION}-${TARGET}-${ARCH}.${EXT}.sha256"
          test -f "$src" || { echo "::error::missing $src"; exit 1; }
          cp "$src" "dist/release-checksums/tauri-${TARGET}-${ARCH}.txt"
          cat "dist/release-checksums/tauri-${TARGET}-${ARCH}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums-tauri-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/release-checksums/tauri-${{ matrix.target }}-${{ matrix.arch }}.txt
          retention-days: 1

      # 诊断用 workflow artifact（含 .sig、latest.json、.index.html）。不是发布路径，
      # 失败不影响 Release（但会让本腿变红；发布判定以 checksums 为准）。
      - name: Upload Tauri bundle (diagnostic artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/tauri/
          retention-days: 14

  # fnOS（飞牛）原生安装包：与桌面矩阵同一触发条件（推送自动发版 / 手工勾选构建产物）。
  # scripts/build-fnos-fpk.ts 内部复用 build:mode 发行产物并捆绑 linux-x64 Node 运行时，
  # 自执行结构断言与发行冒烟（CI 为 POSIX，冒烟会真实运行）——失败即失败，不产出可疑安装包。
  fnos:
    needs: [release, verify]
    if: ${{ github.event_name == 'push' || inputs.build_artifacts }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # fnpack 与 linux-x64 Node 运行时按构建脚本内的版本常量下载；cache key 带脚本哈希，
      # 版本常量一变缓存自动失效（未命中就重新下载，不影响正确性）。
      - uses: actions/cache@v4
        with:
          path: dist/fnos/.cache
          key: fnos-cache-${{ runner.os }}-${{ hashFiles('scripts/fnos-fpk/build-lib.ts') }}

      # SEA TUI 资产所需的 workspace dist 由 build-mode.mjs 的 buildOutputs 自行前置构建
      #（含根 @mode/shared 的 tsc -b；2026-10-12 首次真正跑到该路径才暴露缺它）。
      - name: Build fnOS install package
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/build-fnos-fpk.ts --version "$VERSION"

      - name: Upload fnOS asset to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # 与桌面腿一致：GitHub API 偶发失败重试 3 次，--clobber 让重试可安全覆盖。
          fpk="dist/fnos/releases/$VERSION/mode-$VERSION-x86_64.fpk"
          test -f "$fpk" || { echo "::error::missing $fpk"; exit 1; }
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "$fpk" --clobber; then
              exit 0
            fi
            echo "::warning::gh release upload failed (attempt $attempt/3), retrying in 10s"
            sleep 10
          done
          echo "::error::gh release upload failed after 3 attempts"
          exit 1

      # 校验片段：构建脚本已按合并清单元格式生成 <fpk>.sha256，直接复用为片段
      # （口径与桌面腿一致：只覆盖用户会直接下载的安装包）。
      - name: Generate fnOS checksum fragment
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-checksums
          cp "dist/fnos/releases/$VERSION/mode-$VERSION-x86_64.fpk.sha256" dist/release-checksums/fnos-x86_64.txt
          cat dist/release-checksums/fnos-x86_64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums-fnos
          path: dist/release-checksums/fnos-x86_64.txt
          retention-days: 1

  # 发布线的真正门：只合并 `release-checksums-*`。三条 Tauri 腿都在上传 Release
  # **之后**才上传各自的校验片段。任一 Tauri 腿失败都会让 tauri.result = failure
  # （2026-10-19 起没有 continue-on-error），本 job 不跑，publish 保持 draft。
  checksums:
    needs: [release, verify, tauri, fnos]
    # 三平台腿全部阻断发布：tauri 是矩阵 job，任一腿失败即 failure。
    # 若 tauri 因 `build_artifacts=false` 被跳过，本 job 也跳过，publish 允许这种
    # 手工无产物的发布路径（与改动前一致）。
    if: ${{ always() && needs.release.result == 'success' && needs.verify.result == 'success' && needs.tauri.result == 'success' && (needs.fnos.result == 'success' || needs.fnos.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-checksums-*
          merge-multiple: true
          path: release-checksums

      - name: Merge checksum fragments
        run: |
          set -euo pipefail
          shopt -s nullglob
          fragments=(release-checksums/*.txt)
          if [ ${#fragments[@]} -eq 0 ]; then
            echo "::error::no checksum fragments were produced"
            exit 1
          fi
          # 同一文件名出现多个哈希说明片段来源重叠，宁可失败也不发布有歧义的清单；
          # sort -k 2 使同一文件名相邻，uniq -d 即可检出。
          cat "${fragments[@]}" | LC_ALL=C sort -k 2 > sha256-merged.txt
          duplicated="$(awk '{ print $2 }' sha256-merged.txt | uniq -d)"
          if [ -n "$duplicated" ]; then
            echo "::error::duplicate checksum entries for: $duplicated"
            exit 1
          fi
          mv sha256-merged.txt sha256.txt
          cat sha256.txt
          # 回归保护：清单必须覆盖当前发布面的安装包
          # （Windows .exe + macOS .dmg + Linux .AppImage + fnOS .fpk）；
          # 缺任一类都说明上传或片段生成出了问题，阻止发布而不是发布不完整的清单。
          # 断言只看扩展名、不看产品名前缀；新增平台时同步改 matrix 与这里。
          for pattern in \
            '^[0-9a-f]{64}  [^ ]+\.exe$' \
            '^[0-9a-f]{64}  [^ ]+\.dmg$' \
            '^[0-9a-f]{64}  [^ ]+\.AppImage$' \
            '^[0-9a-f]{64}  [^ ]+\.fpk$'; do
            if ! grep -Eq "$pattern" sha256.txt; then
              echo "::error::sha256.txt is missing an entry matching $pattern"
              exit 1
            fi
          done

      - name: Upload merged checksum file
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          # 本 job 不做 checkout：工作目录没有 git 仓库，gh 无法从 remote 推断目标仓库，
          # 必须显式 --repo（其余 job 靠 checkout 提供上下文，此处不重复拉取仓库）。
          for attempt in 1 2 3; do
            if gh release upload "$TAG" sha256.txt --clobber --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "::warning::gh release upload failed (attempt $attempt/3), retrying in 10s"
            sleep 10
          done
          echo "::error::gh release upload failed after 3 attempts"
          exit 1

  # 只有 Tauri 三平台安装包（Windows/macOS/Linux）、fnOS 安装包与完整校验清单
  # 都成功才公开 release；任一构建失败则保持 draft，由人工排查后重跑或删除，
  # 避免不完整的版本出现在 Releases 与官网下载页。
  # keep_draft=true（上游审计自动构建的测试版）：即使全部成功也保持 draft，不公开、
  # 不进入自动更新。
  #
  # 2026-10-19 起三平台腿全部是硬门（移除 continue-on-error）：
  #   - 任一 Tauri 腿失败 → tauri.result = failure → publish 不跑；
  #   - `skipped` 只出现在手工触发且 `build_artifacts=false` 的既有路径里
  #     （此时 checksums 也 skipped），保持与改动前一致。
  #
  # checksums 仍在 needs 里：它证明四个安装包及其校验片段确实进了本次 Release。
  publish:
    needs: [release, verify, tauri, checksums, fnos, remote-assets]
    if: ${{ always() && inputs.keep_draft != true && needs.release.result == 'success' && needs.verify.result == 'success' && (needs.tauri.result == 'success' || needs.tauri.result == 'skipped') && (needs.checksums.result == 'success' || needs.checksums.result == 'skipped') && (needs.fnos.result == 'success' || needs.fnos.result == 'skipped') && (needs.remote-assets.result == 'success' || needs.remote-assets.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--draft=false --repo "$GITHUB_REPOSITORY")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release edit "$TAG" "${args[@]}"
