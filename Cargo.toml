# Rust workspace 根（路线图 M1 任务 1）。
#
# 成员显式列举而非 `crates/*` 通配，理由见 docs/plans/2026-10-15-tauri-skeleton.md
# 「workspace 成员口径」：
#   1. 加入 workspace 会把 target 目录上移到仓库根，而 scripts/build-cua-helper.mjs
#      期望 crates/mode-cua-ax/target/<triple>/release/mode_cua_ax.dll —— 现役已发布
#      addon 的构建会直接断；
#   2. workspace 会用根锁文件重解析它的依赖图，windows/napi 版本可能被动漂移。
# 把 crates/mode-cua-ax 并入 workspace 是独立任务（要连带改 build-cua-helper.mjs 的路径、
# CI rust-cache 的 workspaces、删成员锁文件），完成后才能去掉下面的 exclude。
[workspace]
resolver = "2"
members = [
  "crates/agent-core",
  "crates/agent-protocol",
  "crates/agent-tools",
  "crates/host-channels",
  "crates/atomic-file",
  "crates/plugin-host",
  "crates/plugin-host-adapter",
  "crates/browser-import-helper",
  "crates/browser-import-host",
  "crates/platform",
  "crates/project-memory",
  "crates/commands-service",
  "crates/protocol",
  "crates/rpc-wire",
  "crates/rpc-host",
  "crates/settings-store",
  "crates/tasks-db",
  "crates/task-index-repo",
  "crates/sidecar-host",
  "crates/system-service",
  "crates/tauri-test-manifest",
  "crates/updater",
  "crates/updater-verify",
  "crates/workspace-hook-config",
  "crates/workspace-hook-digest",
  "crates/workspace-hook-trust",
  "crates/workspace-identity",
  "crates/tray",
  "crates/conversation-mirror",
  "crates/credential-store",
  "crates/deeplink",
  "crates/file-service",
  "crates/file-watcher",
  "crates/device-mid",
  "apps/desktop-tauri/src-tauri",
]
exclude = ["crates/mode-cua-ax"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 只给 `agent-tools` 的测试支撑用：第二层（文件快照）的投影是内容 sha256，
# 与 TS 侧 `normalize.mts` 的 `takeFileSnapshot` 同一口径（见该模块注释）。
sha2 = "0.10"
schemars = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
url = "2"
# `saveFile(sourceUrl)` 的取回面（M3 Task 4 · DR-T4-3）。档位与 tauri-plugin-updater 一致：
# reqwest 以 `rustls-no-provider` 编译，TLS provider 由使用者安装（见 crates/platform/src/source_url.rs）。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "blocking"] }
# allow_project 规则的持久化（D1 裁决 (a)：Rust 直连 `.mode/cli/db/db.sqlite`）。
# `bundled` 自带 SQLite 源码，避免依赖系统库版本；表结构是黑盒观察所得（spec §3.3）。
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false }
# 图标面的 Windows 原生解码（M3 Task 4 · DR-T4-2）：Shell 取图标 + GDI 取像素。
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  # SHGetFileInfoW 的签名引用了这个模块的属性类型（windows-sys 按 feature 门住整条声明）。
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # LR-3：远程桌面剪贴板读取（CF_UNICODETEXT）——DataExchange/Memory/Ole 三个模块。
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  # 会话运行时保持唤醒（SetThreadExecutionState）。
  "Win32_System_Power",
] }
# 图标编码成位图 data URL（PNG + base64）。
png = "0.18"
base64 = "0.22"
# 自签证书（**测试用**）：`source_url` 的 TLS 路径要有真握手才叫验过。档位与 rustls 一致
# （`ring` provider，避开 aws-lc-rs 的原生构建）。
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tauri-plugin-notification = "2"
# 终端 PTY（spec `terminal-pty-in-shell.md`）：壳持有终端进程，Host 崩溃/重生不再带走终端。
portable-pty = "0.9"
