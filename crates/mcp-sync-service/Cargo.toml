[package]
name = "mcp-sync-service"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "MCP 用户目录同步（本地读写/候选/导入导出），对应 services/src/mcp-sync 的本地面"

[lib]
name = "mcp_sync_service"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
indexmap = { version = "2", features = ["serde"] }
plugin-discovery = { path = "../plugin-discovery" }
atomic-file = { path = "../atomic-file" }
