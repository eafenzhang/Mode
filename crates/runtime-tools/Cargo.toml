[package]
name = "runtime-tools"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "bundled 工具（bfs/ripgrep/ugrep）二进制解析与 PATH 补丁，对应 services/src/runtime-tools/runtimeToolResolver.ts"

[lib]
name = "runtime_tools"
path = "src/lib.rs"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
runtime-env = { path = "../runtime-env" }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "rt", "macros"] }
