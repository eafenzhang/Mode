[package]
name = "plugin-sync-service"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "插件归档同步：候选扫描、远端判重、导出/导入与写权限探测"

[lib]
name = "plugin_sync_service"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# LT-15 P3 切五：zip 插件源。yauzl 同口径只支持 store/deflate——deflate64/lzma/
# bzip2/zstd 等条目在本配置下报 UnsupportedArchive，与 TS 拒绝行为一致。
zip = { version = "2.2", default-features = false, features = ["deflate"] }
url.workspace = true
# zip 源的 HTTP 下载（手动重定向 + 200 MiB 上限 + 180s 超时）。
reqwest.workspace = true
rustls.workspace = true
flate2 = "1"
plugin-discovery = { path = "../plugin-discovery" }
atomic-file = { path = "../atomic-file" }

[dev-dependencies]
base64 = "0.22"
