[package]
name = "rpc-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "壳内 RPC 客户端（对应 packages/rpc/src/channelClient.ts）"

[lib]
name = "rpc_client"
path = "src/lib.rs"

[dependencies]
rpc-wire = { path = "../rpc-wire" }
rpc-host = { path = "../rpc-host" }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
