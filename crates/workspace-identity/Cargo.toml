[package]
name = "workspace-identity"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "workspaceIdentity 归一与 workspaceKey/hash（对应 shared/remote-workspace-identity.ts 与 services/paths.ts）"

[lib]
name = "workspace_identity"
path = "src/lib.rs"

[dependencies]
sha2.workspace = true
# `build_ssh_remote_host_key` 要与 TS 的 `JSON.stringify([...])` 逐字节一致，
# 含引号转义；手写转义在 host/username 带特殊字符时会漂移。
serde_json.workspace = true
