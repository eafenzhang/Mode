[package]
name = "browser-import-helper"
version = "0.1.0"
edition = "2021"
description = "Windows 浏览器数据导入 helper（契约见 docs/specs/browser-import-helper-contract.md）"
publish = false

[[bin]]
name = "mode-browser-import-helper"
path = "src/main.rs"

[lib]
name = "browser_import_helper"
path = "src/lib.rs"

[dependencies]
# 契约 B 的 base64 编解码（std 引擎，无额外特性）。
base64 = "0.22"
