[package]
name = "provider-source-chain"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "账号 Provider 事实链：配置文件源 + 账号 Overlay → Mode agent ProviderSource"

[lib]
name = "provider_source_chain"
path = "src/lib.rs"

[dependencies]
account-provider-overlay = { path = "../account-provider-overlay" }
agent-process = { path = "../agent-process" }
provider-config = { path = "../provider-config" }
provider-config-source = { path = "../provider-config-source" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
indexmap = "2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
