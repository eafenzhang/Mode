[package]
name = "agent-process"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Agent 子进程生命周期：无控制台拉起、stdio 协议客户端、stderr 广播、优雅关闭与整树强杀"

[lib]
name = "agent_process"
path = "src/lib.rs"

[dependencies]
mode-protocol-client = { path = "../mode-protocol-client" }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "process", "rt-multi-thread", "macros", "sync", "time"] }
