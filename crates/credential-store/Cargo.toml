[package]
name = "credential-store"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "credentials.json 的加密、读取、损坏隔离与原子写回（对应 services/src/credential）"

[lib]
name = "credential_store"
path = "src/lib.rs"

[dependencies]
atomic-file = { path = "../atomic-file" }
ring = "0.17"
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true
