[package]
name = "mode-server"
version.workspace = true
edition.workspace = true
license = "MIT"

[dependencies]
# ws feature：/ws/host 的 trusted-host WS 升级（LT-15 P2 切二）。
axum = { workspace = true, features = ["ws"] }
lan-http = { path = "../lan-http" }
lan-pairing = { path = "../lan-pairing" }
host-channels = { path = "../host-channels" }
rpc-host = { path = "../rpc-host" }
rpc-wire = { path = "../rpc-wire" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "macros", "sync", "time"] }
uuid.workspace = true
futures-util.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite.workspace = true
