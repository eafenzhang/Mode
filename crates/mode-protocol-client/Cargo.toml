[package]
name = "mode-protocol-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Mode Protocol 客户端内核：LF 分帧、请求多路复用、超时、通知与入站请求（不含进程拉起）"

[lib]
name = "mode_protocol_client"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros", "sync", "time"] }
