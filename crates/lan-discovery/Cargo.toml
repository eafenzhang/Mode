[package]
name = "lan-discovery"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "局域网发现纯逻辑：Tailscale 状态解析、单卡合并、广播目标推导"

[lib]
name = "lan_discovery"
path = "src/lib.rs"

[dependencies]
indexmap = "2"
plugin-discovery = { path = "../plugin-discovery" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
