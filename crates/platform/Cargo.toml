[package]
name = "platform"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "IPlatformService 的 Rust 对应：Tauri 平台命令面（规格见 docs/specs/tauri-platform-commands.md）"

[lib]
name = "platform"
path = "src/lib.rs"

[build-dependencies]
tauri-test-manifest = { path = "../tauri-test-manifest" }

[dev-dependencies]
# `saveFile(sourceUrl)` 的 TLS 路径用例要一个**自签证书的本地 TLS 服务**
# （只做测试：产品代码里没有任何证书生成）。
rcgen.workspace = true

[dependencies]
protocol = { path = "../protocol" }
# 深链的冷启动队列由 `notifyRendererReady` 触发回放（见 commands/window.rs），
# 所以 platform 需要拿到 deeplink 的托管状态。依赖方向单向：platform -> deeplink。
deeplink = { path = "../deeplink" }
serde.workspace = true
serde_json.workspace = true
# 对话框命令是回调式 API，用 oneshot 把它接成 async command 的返回值。
# tauri 的 async_runtime 只再导出 mpsc，没有 oneshot，故直接依赖 tokio（版本与 tauri 同族）。
tokio = { workspace = true }
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
# `saveFile(sourceUrl)` 的有上限取回面（M3 Task 4 · DR-T4-3）。
reqwest.workspace = true
rustls.workspace = true
futures-util.workspace = true
# 图标面的 Windows 原生解码（M3 Task 4 · DR-T4-2）：Shell 取图标资源 + GDI 取像素。
windows-sys.workspace = true
# 图标编码：PNG 容器 + base64 data URL。
png.workspace = true
base64.workspace = true
