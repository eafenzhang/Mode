[package]
name = "orcarouter-service"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "OrcaRouter 服务（分阶段）：凭据存储、PKCE、目录与 provider overlay"

[lib]
name = "orcarouter_service"
path = "src/lib.rs"

[dependencies]
credential-store = { path = "../credential-store" }
provider-config = { path = "../provider-config" }
provider-config-file-codec = { path = "../provider-config-file-codec" }
provider-config-repository = { path = "../provider-config-repository" }
model-selection = { path = "../model-selection" }
provider-config-source = { path = "../provider-config-source" }
indexmap = { version = "2", features = ["serde"] }
base64.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
getrandom = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
