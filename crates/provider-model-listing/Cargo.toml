[package]
name = "provider-model-listing"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Provider「检测可用模型」的请求构造与响应分页解析（对应 packages/provider/src/model-listing.ts）"

[lib]
name = "provider_model_listing"
path = "src/lib.rs"

[dependencies]
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
provider-config = { path = "../provider-config" }
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
