[package]
name = "agent-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Rust 版 app-server --stdio：LF 分帧、方法分派与进程生命周期（LT-1 C1）"

[lib]
name = "agent_server"
path = "src/lib.rs"

[[bin]]
name = "agent-server"
path = "src/main.rs"

[dependencies]
agent-protocol = { path = "../agent-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "process", "time"] }
