[package]
name = "agent-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Rust 版 app-server --stdio：LF 分帧、方法分派与进程生命周期（LT-1 C1）"

[lib]
name = "agent_server"
path = "src/lib.rs"

[[bin]]
name = "agent-server"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../agent-core" }
# C3 T4：`session/subagents` 的不透明分页游标（base64(JSON)）。
base64.workspace = true
agent-protocol = { path = "../agent-protocol" }
# C4 T1：MCP 状态的 `updatedAt` 与 data-root 同一套 ISO8601 投影；http transport 用 reqwest。
data-root = { path = "../data-root" }
reqwest.workspace = true
# reqwest 以 rustls-no-provider 编译；MCP http transport 在使用前装 ring provider。
rustls.workspace = true
indexmap = "2"
# C3 T2：apiRetry 状态的唯一归一化/投影规则（不复制规则）。
mode-api-retry = { path = "../mode-api-retry" }
model-selection = { path = "../model-selection" }
# C2 T3：项目记忆只读召回（记忆目录扫描 + MEMORY.md 索引读取的安全规则都在该 crate）。
project-memory = { path = "../project-memory" }
# C4 T2：技能目录发现与 SKILL.md 解析（`.mode/skills` + 插件 skill）。
skills-service = { path = "../skills-service" }
# C4 T2：插件 manifest/缓存/安装记录的发现规则（与 skills-service 共用一份）。
plugin-discovery = { path = "../plugin-discovery" }
provider-config = { path = "../provider-config" }
provider-config-repository = { path = "../provider-config-repository" }
provider-config-source = { path = "../provider-config-source" }
provider-http = { path = "../provider-http" }
provider-resolver = { path = "../provider-resolver" }
serde.workspace = true
serde_json.workspace = true
session-store = { path = "../session-store" }
tokio = { workspace = true, features = ["io-std", "io-util", "time"] }
uuid.workspace = true

[dev-dependencies]
# Task 9 切换测试：跨包拿不到本包二进制的 CARGO_BIN_EXE，由本包集成测试驱动
# agent-process 的 spawn API（MODE_AGENT_SERVER_COMMAND 指向本二进制）。
agent-process = { path = "../agent-process" }
rusqlite.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "process", "time"] }

# 切换测试的无孤儿断言：Toolhelp 快照枚举 pid/父 pid/映像名（进程树观测）。
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
] }
