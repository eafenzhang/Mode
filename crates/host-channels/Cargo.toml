[package]
name = "host-channels"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "壳内频道适配器：把已移植的服务（先 memory）接成 rpc_host::ServerChannel"

[lib]
name = "host_channels"
path = "src/lib.rs"

[dependencies]
onboarding-record-service = { path = "../onboarding-record-service" }
agent-process = { path = "../agent-process" }
agent-protocol = { path = "../agent-protocol" }
broadcast-service = { path = "../broadcast-service" }
commands-service = { path = "../commands-service" }
git-cli = { path = "../git-cli" }
mcp-sync-service = { path = "../mcp-sync-service" }
git-service = { path = "../git-service" }
git-checkpoint-service = { path = "../git-checkpoint-service" }
conversation-mirror = { path = "../conversation-mirror" }
credential-store = { path = "../credential-store" }
file-service = { path = "../file-service" }
file-watcher = { path = "../file-watcher" }
project-memory = { path = "../project-memory" }
settings-store = { path = "../settings-store" }
skills-service = { path = "../skills-service" }
settings-sync-service = { path = "../settings-sync-service" }
skill-sync-service = { path = "../skill-sync-service" }
plugin-sync-service = { path = "../plugin-sync-service" }
subagents-service = { path = "../subagents-service" }
system-service = { path = "../system-service" }
workspace-hooks-service = { path = "../workspace-hooks-service" }
terminal-service = { path = "../terminal-service" }
rpc-host = { path = "../rpc-host" }
rpc-wire = { path = "../rpc-wire" }
# LT-15 P4：usage-stats 频道的余额查询链路（凭据 + HTTP 取回）。
provider-balance = { path = "../provider-balance" }
provider-config-repository = { path = "../provider-config-repository" }
provider-config-source = { path = "../provider-config-source" }
# LT-16.1：mode-task 频道的任务索引底层（已与 TS 对拍）。
task-index-repo = { path = "../task-index-repo" }
automation-runtime = { path = "../automation-runtime" }
automation-repo = { path = "../automation-repo" }
provider-config = { path = "../provider-config" }
provider-resolver = { path = "../provider-resolver" }
# resolveInteraction envelope 的 commandId 生成。
uuid.workspace = true
workspace-identity = { path = "../workspace-identity" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lan-discovery = { path = "../lan-discovery" }
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true
# getTaskSnapshotWithEtag 的 ETag（sha256(JSON)，TS createHash 同口径）。
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
provider-config = { path = "../provider-config" }
provider-config-file-codec = { path = "../provider-config-file-codec" }
