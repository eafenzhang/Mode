[package]
name = "host-channels"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "壳内频道适配器：把已移植的服务（先 memory）接成 rpc_host::ServerChannel"

[lib]
name = "host_channels"
path = "src/lib.rs"

[dependencies]
conversation-mirror = { path = "../conversation-mirror" }
project-memory = { path = "../project-memory" }
settings-store = { path = "../settings-store" }
rpc-host = { path = "../rpc-host" }
rpc-wire = { path = "../rpc-wire" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
