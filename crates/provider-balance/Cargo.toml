[package]
name = "provider-balance"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "外部 API Key Provider 余额识别与响应解析（对应 services/src/usage-stats/providers/providerBalanceSpecs.ts）"

[lib]
name = "provider_balance"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
url.workspace = true
# LT-15 P4：余额查询的真实 HTTP 取回；reqwest 以 rustls-no-provider 编译，
# ring provider 在构造时安装（见 crates/platform/src/source_url.rs 同款）。
reqwest.workspace = true
rustls.workspace = true
provider-config = { path = "../provider-config" }
provider-config-source = { path = "../provider-config-source" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
